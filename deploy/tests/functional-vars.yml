# Extra vars for the functional test (deploy/tests/deploy-flow.sh): everything
# renamed (ahtest-*), high ports, Caddy's internal CA, never AH.
domain: ah.test
tls_mode: internal
redirect_www: true
app_container: ahtest-app
app_compose_project: ahtest-app
app_volume_instance: ahtest-instance
app_volume_logs: ahtest-logs
edge_network: ahtest-edge
caddy_container: ahtest-caddy
caddy_compose_project: ahtest-caddy
caddy_http_port: 18080
caddy_https_port: 18443
app_upstream: ahtest-app:8733
health_timeout: 120
app_settings:
  BONUS_PREWARM: "false"
  PRIVACY_CONTACT: privacy@example.nl
