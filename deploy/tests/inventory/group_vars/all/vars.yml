tls_mode: letsencrypt
acme_email: admin@example.nl
redirect_www: true
image_repo: 127.0.0.1:5055/ah-dashboard
admin_ssh_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleExampleExampleExampleExampleExampleEx admin@example
