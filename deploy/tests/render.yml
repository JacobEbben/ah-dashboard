---
# Renders the role templates with the test inventory (+ extra vars) into
# $OUT/$VARIANT, through the roles themselves so variable precedence is the
# same as in production. deploy/tests/run.sh then checks the results.
- name: Render the deployment templates
  hosts: vps
  connection: local
  gather_facts: false
  vars:
    render_dir: "{{ lookup('env', 'OUT') }}/{{ lookup('env', 'VARIANT') | default('main', true) }}"
  tasks:
    - name: Output folder
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0755"

    - name: Caddy templates
      ansible.builtin.import_role:
        name: caddy
        tasks_from: render

    - name: App templates
      ansible.builtin.import_role:
        name: app
        tasks_from: render
