---
- name: Check the operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: "These roles support Debian and Ubuntu servers only (found {{ ansible_facts['distribution'] }})."
    quiet: true

- name: Refuse to harden SSH without an admin key (it would lock you out)
  ansible.builtin.assert:
    that:
      - not ssh_harden or (admin_ssh_keys | length > 0)
    fail_msg: "ssh_harden is on but admin_ssh_keys is empty: add your public key first (ah-iac configure)."
    quiet: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - unattended-upgrades
      - sudo
      - python3-debian   # needed by ansible.builtin.deb822_repository (docker role)
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Turn on automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      // Managed by Ansible (deploy/ansible/roles/base)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  when: auto_security_updates

- name: Authorize the admin SSH keys for {{ ansible_user | default('root') }}
  ansible.posix.authorized_key:
    user: "{{ ansible_user | default('root') }}"
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_keys }}"
  loop_control:
    label: "{{ item.split()[-1] if item.split() | length > 2 else 'key' }}"

- name: Harden the SSH server (keys only)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-ah-hardening.conf
    content: |
      # Managed by Ansible (deploy/ansible/roles/base)
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PermitEmptyPasswords no
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_harden
  notify: Reload ssh

# "allow", not "limit": ufw's limit rejects an address after 6 connections in
# 30 s, which locks out a few quick ah-iac runs or a CI deploy (the VPS
# simulation hit it). With key-only SSH there is no password to guess.
- name: Firewall - allow SSH before switching the firewall on
  community.general.ufw:
    rule: allow
    port: "{{ ansible_port | default(22) | string }}"
    proto: tcp

- name: Firewall - allow HTTP and HTTPS (HTTP/3 too) for Caddy
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop:
    - { port: "80", proto: tcp }
    - { port: "443", proto: tcp }
    - { port: "443", proto: udp }

- name: Firewall - deny everything else incoming and switch it on
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
