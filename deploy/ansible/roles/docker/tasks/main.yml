---
- name: Remove distribution Docker packages that conflict with Docker's own
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-doc, podman-docker, containerd, runc]
    state: absent

- name: Docker apt key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker's apt signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}"
    signed_by: /etc/apt/keyrings/docker.asc

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Docker daemon settings (log rotation, keep containers running during daemon upgrades)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Docker is running and starts at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Apply a changed daemon configuration now
  ansible.builtin.meta: flush_handlers

- name: Log in to the image registry (private images only)
  ansible.builtin.command:
    cmd: docker login {{ registry_host }} --username {{ registry_user }} --password-stdin
    stdin: "{{ registry_token }}"
  changed_when: false
  no_log: true
  when: registry_token | length > 0
