---
# The image CI builds and pushes, e.g. ghcr.io/<owner>/ah-dashboard. ah-deploy
# only accepts images from this repository, by digest.
image_repo: ""
# Deploy this image during `ah-iac provision` (repo@sha256:digest). Empty: keep
# what runs; the first image then comes from the Release workflow or
# `ah-iac deploy`.
app_image: ""

app_dir: /opt/ah-dashboard
app_compose_project: ah-dashboard
app_container: ah-dashboard
app_volume_instance: ah-instance
app_volume_logs: ah-logs
backup_dir: /var/backups/ah-dashboard
backup_keep: 10
health_timeout: 180

# The CI deploy key (public part): may only run ah-deploy-ssh (deploy / status
# / rollback). Empty: no CI deploys.
deploy_user: ah-deploy
deploy_ssh_key: ""

# Non-secret app settings for app.env (see .env.example), e.g.
#   app_settings: {PRIVACY_CONTACT: privacy@example.nl, MAX_USERS: "500"}
# Proxy, HTTPS and secret settings are managed below and can't be set here.
app_settings: {}

# Secrets, from the vault (inventory/.../group_vars/all/vault.yml).
app_secrets:
  TOKEN_SEAL_SECRET: "{{ vault_token_seal_secret | default('') }}"
  ADMIN_PASSWORD_HASH: "{{ vault_admin_password_hash | default('') }}"
  LOGIN_CLIENT_SECRET: "{{ vault_login_client_secret | default('') }}"
  AH_REFRESH_TOKEN: "{{ vault_ah_refresh_token | default('') }}"
  AH_ACCESS_TOKEN: "{{ vault_ah_access_token | default('') }}"

# Always set (behind Caddy on the edge network, HTTPS only).
app_managed:
  APP_ENV: production
  TRUSTED_PROXY: "*"
  TRUSTED_PROXY_COUNT: "1"
  ADMIN_COOKIE_SECURE: "true"
  PUBLIC_BASE_URL: "https://{{ domain }}"
