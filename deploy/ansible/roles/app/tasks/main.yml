---
- name: Check the app settings
  ansible.builtin.assert:
    that:
      - image_repo is match('^[a-z0-9][a-z0-9._/:-]*$')
      - app_image == '' or app_image is match('^' ~ (image_repo | regex_escape) ~ '@sha256:[0-9a-f]{64}$')
      - (app_secrets.TOKEN_SEAL_SECRET | length) >= 16
      - app_settings is mapping
      - app_settings.keys() | reject('match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
      - app_settings.values() | map('string') | select('search', '[\r\n]') | list | length == 0
      - app_settings.keys() | intersect(app_managed.keys() | list + app_secrets.keys() | list) | length == 0
    fail_msg: >-
      Check image_repo (lower case), app_image (image_repo@sha256:<digest>), vault_token_seal_secret
      (16+ characters; never change it once set) and app_settings (UPPER_CASE names, one-line values,
      not one of the managed or secret settings).
    quiet: true

- name: Check the secrets (one line, no single quotes)
  ansible.builtin.assert:
    that:
      - app_secrets.values() | map('string') | select('search', "[\r\n']") | list | length == 0
    fail_msg: "A vault value contains a line break or a single quote; app.env can't hold it."
    quiet: true
  no_log: true

# --- the server-side deploy tool ------------------------------------------------
- name: Deploy settings (/etc/ah-deploy.conf)
  ansible.builtin.template:
    src: ah-deploy.conf.j2
    dest: /etc/ah-deploy.conf
    owner: root
    group: root
    mode: "0644"

- name: Deploy tools
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [ah-deploy, ah-deploy-ssh]

- name: Folders (app, backups)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ app_dir }}"
    - "{{ backup_dir }}"

# --- the app itself --------------------------------------------------------------
- name: App Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ app_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"
  notify: Restart app

- name: App settings and secrets (app.env, readable by root only)
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/app.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart app

# --- the CI deploy user ----------------------------------------------------------------
- name: Deploy user for CI
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    password: "!"
    create_home: true
    state: present

- name: The deploy user may run ah-deploy as root, nothing else
  ansible.builtin.copy:
    dest: /etc/sudoers.d/ah-deploy
    content: |
      # Managed by Ansible (deploy/ansible/roles/app)
      {{ deploy_user }} ALL=(root) NOPASSWD: /usr/local/bin/ah-deploy
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: CI deploy key (restricted to ah-deploy-ssh)
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_ssh_key }}"
    key_options: 'restrict,command="/usr/local/bin/ah-deploy-ssh"'
    exclusive: true
    state: "{{ 'present' if deploy_ssh_key | length > 0 else 'absent' }}"
  when: deploy_ssh_key | length > 0

- name: No CI deploy key configured - remove any old one
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    state: absent
  when: deploy_ssh_key | length == 0

# --- start / deploy ----------------------------------------------------------------
- name: Apply changed settings to a running app
  ansible.builtin.meta: flush_handlers

- name: Deploy the requested image
  ansible.builtin.command:
    cmd: /usr/local/bin/ah-deploy deploy {{ app_image }}
  register: deployed
  changed_when: "'already running' not in deployed.stderr"
  when: app_image | length > 0

- name: What is deployed
  ansible.builtin.command:
    cmd: /usr/local/bin/ah-deploy status
  register: status
  changed_when: false

- name: Show the deploy status
  ansible.builtin.debug:
    msg: "{{ status.stdout_lines }}"

- name: Nothing deployed yet
  ansible.builtin.debug:
    msg: "No image deployed yet: run the Release workflow, or deploy/ah-iac deploy <image>@sha256:<digest>."
  when: status.stdout is search('^current:\\s*$', multiline=True)
