---
# Tests only (deploy/tests/render.yml): render this role's templates into
# render_dir with the role's defaults and the inventory, nothing else.
- name: Render the app templates
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ render_dir }}/app-{{ item }}"
    mode: "0644"
  loop: [compose.yaml, app.env, ah-deploy.conf]
