# Used through ANSIBLE_CONFIG (set by the toolbox image and the workflows), so
# it also applies when the folder is world-writable (Ansible ignores an
# ansible.cfg found in such a folder by itself).
[defaults]
inventory = inventory/production/hosts.yml
roles_path = roles
collections_path = /usr/share/ansible/collections
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# Never print secrets from the vault in diffs or results.
display_args_to_stdout = false

[ssh_connection]
pipelining = true
# Host keys come from the inventory's known_hosts (filled and confirmed by
# `ah-iac configure`): an unknown or changed key stops the run.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=inventory/production/known_hosts -o IdentitiesOnly=yes
