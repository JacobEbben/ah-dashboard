---
# Deploy one image (normally the Release workflow does this over the
# restricted deploy key; this is the same with your admin key):
#   deploy/ah-iac deploy ghcr.io/<owner>/ah-dashboard@sha256:<digest>
- name: Deploy an AH Dashboard image
  hosts: all
  become: true
  gather_facts: false
  vars:
    app_image: ""
  tasks:
    - name: Check the image reference
      ansible.builtin.assert:
        that:
          - app_image is match('^' ~ (image_repo | regex_escape) ~ '@sha256:[0-9a-f]{64}$')
        fail_msg: "Give -e app_image={{ image_repo }}@sha256:<64 hex>"
        quiet: true

    - name: Deploy (backup, switch, health check, automatic rollback)
      ansible.builtin.command:
        cmd: /usr/local/bin/ah-deploy deploy {{ app_image }}
      register: deployed
      changed_when: "'already running' not in deployed.stderr"

    - name: Deploy log
      ansible.builtin.debug:
        msg: "{{ deployed.stderr_lines }}"
