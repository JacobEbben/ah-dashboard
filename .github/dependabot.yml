# Pinned versions only stay safe when something proposes updates. Each update
# arrives as a pull request and goes through CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # App image base (Dockerfile digest).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  # App dependencies: requirements.txt ranges; regenerate requirements.lock in the PR
  # (CI's lock job fails until it matches).
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
