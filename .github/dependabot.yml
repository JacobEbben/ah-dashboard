# Pinned versions only stay safe when something proposes updates. Each update
# arrives as a pull request and goes through CI (including the deployment tests).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

  # App image base (Dockerfile digest) and the Ansible toolbox base.
  - package-ecosystem: docker
    directories: ["/", "/deploy/tools"]
    schedule: { interval: weekly }

  # Ansible toolbox Python packages (hashed lock generated from requirements.in).
  - package-ecosystem: pip
    directory: /deploy/tools
    schedule: { interval: weekly }

  # App dependencies: requirements.txt ranges; regenerate requirements.lock in the PR
  # (CI's lock job fails until it matches).
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
