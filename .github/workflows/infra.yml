# Server setup from GitHub (the same as `deploy/ah-iac provision` on your own
# machine): base system, Docker, Caddy with certificates, the app. Manual only,
# in the "infrastructure" environment (give it required reviewers: its key can
# change the whole server).
name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run shows what would change; apply changes the server"
        type: choice
        options: [dry-run, apply]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: infrastructure
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    environment: infrastructure
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Ansible toolbox
        run: docker build -q -t ah-iac-tools -f deploy/tools/Dockerfile deploy

      - name: Run site.yml
        env:
          ANSIBLE_SSH_KEY: ${{ secrets.ANSIBLE_SSH_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          secrets="$RUNNER_TEMP/secrets"
          install -m 700 -d "$secrets"
          install -m 600 /dev/null "$secrets/ssh_key"
          install -m 600 /dev/null "$secrets/vault-pass"
          printf '%s\n' "$ANSIBLE_SSH_KEY" > "$secrets/ssh_key"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$secrets/vault-pass"
          extra=()
          [[ "$MODE" == apply ]] || extra=(--check --diff)
          docker run --rm -v "$PWD:/work" -v "$secrets:/secrets:ro" -w /work/deploy/ansible \
            -e ANSIBLE_PRIVATE_KEY_FILE=/secrets/ssh_key -e ANSIBLE_VAULT_PASSWORD_FILE=/secrets/vault-pass \
            -e ANSIBLE_FORCE_COLOR=1 \
            ah-iac-tools ansible-playbook site.yml "${extra[@]}"
