{# Bonus view: the user's own groups of categories (static/js/bonus/groups.js).
   Also reachable without dragging: rename, add, remove, delete here. #}
<div id="bonusGroupPanel" class="filterpanel collapsed">
  <button type="button" id="bonusGroupToggle" class="foldbtn" aria-expanded="false" aria-controls="bonusGroupsBody">
    <span class="chev">▾</span> <span data-i18n="catGroupsTitle"></span> <span id="bonusGroupSummary" class="foldcount"></span>
  </button>
  <div id="bonusGroupsBody" class="filters">
    <div class="filterrow fullrow">
      <p class="smeta grouphint" data-i18n="catGroupsHint"></p>
      <div id="bonusGroupList" class="grouplist"></div>
      <div class="cat-actions">
        <button type="button" id="bonusGroupNew" class="mini" data-i18n="newGroup"></button>
      </div>
      <span id="bonusGroupLive" class="sronly" aria-live="polite"></span>
    </div>
  </div>
</div>
