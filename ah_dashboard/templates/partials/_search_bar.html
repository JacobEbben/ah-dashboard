{# Product-name search within the current filters. Hidden until results are loaded. #}
<div id="searchBar" class="searchbar" role="search" hidden>
  <label for="productSearch" class="searchlabel" data-i18n="searchProducts"></label>
  <input id="productSearch" type="search" class="wide-input" data-i18n-ph="searchProductsPh"
         maxlength="100" autocomplete="off" spellcheck="false">
  <button type="button" id="productSearchClear" class="mini" data-i18n="clear" hidden></button>
</div>
