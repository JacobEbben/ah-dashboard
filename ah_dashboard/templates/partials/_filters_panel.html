{# Product types and the presets (named product-type selections). Hidden until results are loaded. #}
<div id="filterPanel" class="filterpanel collapsed" hidden>
  <button type="button" id="filterToggle" class="foldbtn" aria-expanded="false" aria-controls="filters">
    <span class="chev">▾</span> <span data-i18n="filtersPresets"></span>
  </button>
  <div id="filters" class="filters">
    <div class="filterrow presetrow">
      <label for="presetSel" data-i18n="presets"></label>
      <div class="preset-actions">
        <select id="presetSel"><option value=""></option></select>
        <button type="button" id="presetUpdate" class="mini" data-i18n="updatePreset" data-i18n-title="updatePresetTitle" disabled></button>
        <button type="button" id="presetDel" class="mini" data-i18n="delete" data-i18n-title="deleteTitle" disabled></button>
        <input id="presetName" type="text" data-i18n-ph="presetNamePh" maxlength="40" autocomplete="off">
        <button type="button" id="presetSave" class="mini" data-i18n="save" data-i18n-title="saveTitle"></button>
      </div>
    </div>
    <div class="filterrow catrow">
      <label data-i18n="productTypes"></label>
      <div class="cat-actions">
        <button type="button" id="catAll" class="mini" data-i18n="all" data-i18n-title="allCatsTitle" aria-pressed="true"></button>
        <button type="button" id="catNone" class="mini" data-i18n="none"></button>
      </div>
      <div id="cats" class="cats"></div>
    </div>
  </div>
</div>
